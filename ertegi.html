<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ертегілер әлемі — Интерактивті сабақ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #FFF9F0;
            --surface: #FFFFFF;
            --blue: #4EA8DE;
            --blue-light: #D8EEFF;
            --yellow: #FFD166;
            --yellow-light: #FFF3D6;
            --green: #06D6A0;
            --green-light: #E0FFF7;
            --red: #EF476F;
            --red-light: #FFE5EC;
            --purple: #9D4EDD;
            --purple-light: #F3E8FF;
            --text-dark: #2B2D42;
            --text-muted: #6C757D;
            --border: #2B2D42;
            --radius-md: 20px;
            --radius-lg: 32px;
            --shadow-solid-sm: 0 4px 0px var(--border);
            --shadow-solid-md: 0 6px 0px var(--border);
            --shadow-solid-lg: 0 10px 0px var(--border);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#E2D9C8 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
            line-height: 1.5;
            padding-bottom: 40px;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- ШАПКА --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .header h1 {
            font-size: 32px;
            color: var(--blue);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface);
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid var(--border);
        }

        /* --- ЕРТЕГІ ТАҢДАУ --- */
        .tale-selector {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 4px;
            margin-bottom: 20px;
            scrollbar-width: none;
            justify-content: flex-start;
        }
        .tale-selector::-webkit-scrollbar { display: none; }

        .tale-btn {
            background: var(--surface);
            border: 3px solid var(--border);
            padding: 10px 20px;
            border-radius: 999px;
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-solid-sm);
            transition: all 0.1s;
        }

        .tale-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-solid-md); }
        .tale-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px var(--border); }
        .tale-btn.active { background: var(--yellow); color: var(--text-dark); }

        /* --- ПРОГРЕСС БАР --- */
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            background: var(--surface);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: 3px solid var(--border);
            box-shadow: var(--shadow-solid-sm);
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .progress-step.active { opacity: 1; transform: scale(1.1); }
        .progress-step.done { opacity: 1; }

        .step-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #E2E8F0;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka';
            font-weight: 700;
            color: var(--text-dark);
        }

        .progress-step.active .step-circle { background: var(--blue); color: white; border-color: var(--blue); }
        .progress-step.done .step-circle { background: var(--green); color: white; border-color: var(--green); }

        .step-text {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
        }

        .progress-line {
            flex-grow: 1;
            height: 4px;
            background: #E2E8F0;
            margin: 0 10px;
            border-radius: 2px;
            position: relative;
            top: -10px;
        }
        .progress-line.filled { background: var(--green); }

        /* --- НЕГІЗГІ ПАНЕЛЬ --- */
        .main-panel {
            background: var(--surface);
            border: 4px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-solid-lg);
            position: relative;
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .step-title {
            text-align: center;
            color: var(--blue);
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* --- 1. МНЕМОТАБЛИЦА --- */
        .mnemo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .mnemo-frame {
            aspect-ratio: 1 / 1;
            border: 3px dashed #B0B0B0;
            border-radius: var(--radius-md);
            background: #F8F9FA;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }

        .mnemo-frame:hover { background: var(--blue-light); border-color: var(--blue); }
        .mnemo-frame.active {
            border: 3px solid var(--border);
            background: var(--yellow-light);
            box-shadow: inset 0 0 0 3px var(--yellow);
        }

        .mnemo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .mnemo-placeholder {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            color: var(--text-muted); font-weight: 700; font-size: 13px; text-align: center; padding: 10px;
        }
        .mnemo-placeholder svg { width: 32px; height: 32px; stroke: var(--text-muted); }

        .mnemo-number {
            position: absolute; top: 8px; left: 8px; width: 28px; height: 28px;
            background: var(--surface); border: 2px solid var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka', sans-serif; font-weight: 700; color: var(--text-dark); z-index: 2;
        }

        .story-text-box {
            background: var(--blue-light); border: 3px solid var(--blue);
            border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; text-align: center;
            flex-grow: 1;
        }
        .story-step-title { font-size: 22px; color: var(--blue); margin-bottom: 8px; }
        .story-step-text { font-size: 18px; font-weight: 700; color: var(--text-dark); line-height: 1.6; }

        /* --- 2. РЕТІМЕН ҚҰРАУ --- */
        .order-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px;
        }
        .order-slot {
            aspect-ratio: 1 / 1; border: 3px dashed #B0B0B0; border-radius: var(--radius-md);
            background: #F8F9FA; display: flex; align-items: center; justify-content: center; position: relative;
            overflow: hidden;
        }
        .order-slot.drag-over { border-color: var(--green); background: var(--green-light); }

        .drag-pool {
            display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; background: var(--purple-light);
            border: 3px solid var(--purple); border-radius: var(--radius-md); min-height: 100px; margin-bottom: 20px;
        }
        .drag-pool.drag-over { border-color: var(--green); background: var(--green-light); }

        .drag-card {
            width: 80px; height: 80px; border: 3px solid var(--border); border-radius: 16px;
            background: var(--surface); cursor: grab; overflow: hidden; box-shadow: 0 4px 0 var(--border);
            position: relative;
        }
        .drag-card:active { cursor: grabbing; }
        .drag-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .drag-card-text {
            display: flex; align-items: center; justify-content: center; text-align: center;
            height: 100%; font-size: 12px; font-weight: 800; color: var(--text-dark); padding: 4px; pointer-events: none;
        }

        .order-slot .drag-card {
            width: 100%; height: 100%; border-radius: calc(var(--radius-md) - 3px);
            border: none; box-shadow: none; margin: 0;
        }

        /* --- 3. СҰРАҚ-ЖАУАП --- */
        .quiz-progress { font-family: 'Fredoka', sans-serif; font-size: 16px; color: var(--purple); margin-bottom: 16px; text-align: center; }
        .quiz-question { font-size: 22px; text-align: center; margin-bottom: 24px; color: var(--text-dark); }

        .quiz-option {
            display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
            background: var(--surface); border: 3px solid var(--border); padding: 16px 20px;
            border-radius: var(--radius-md); margin-bottom: 12px; font-family: 'Nunito', sans-serif;
            font-size: 18px; font-weight: 800; color: var(--text-dark); cursor: pointer;
            box-shadow: var(--shadow-solid-sm); transition: all 0.1s;
        }
        .quiz-option:hover { transform: translateY(-2px); }
        .quiz-option:active { transform: translateY(4px); box-shadow: 0 0px 0px var(--border); }

        .quiz-option .option-letter {
            width: 32px; height: 32px; background: var(--yellow-light); border: 2px solid var(--border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka', sans-serif; font-weight: 700; flex-shrink: 0;
        }
        .quiz-option.correct { background: var(--green-light); border-color: var(--green); box-shadow: 0 4px 0 var(--green); }
        .quiz-option.correct .option-letter { background: var(--green); color: white; border-color: var(--green); }
        .quiz-option.wrong { background: var(--red-light); border-color: var(--red); box-shadow: 0 4px 0 var(--red); }
        .quiz-option.wrong .option-letter { background: var(--red); color: white; border-color: var(--red); }

        /* --- 4. СӨЙЛЕМ ҚҰРАУ --- */
        .sentence-builder {
            display: flex; flex-wrap: wrap; gap: 10px; min-height: 100px;
            border: 3px dashed var(--purple); border-radius: var(--radius-md); padding: 16px;
            align-items: center; margin-bottom: 24px; background: var(--purple-light);
        }
        .sentence-builder:empty::before {
            content: 'Сөздерді осында басыңыз...'; color: var(--purple);
            font-weight: 700; width: 100%; text-align: center; opacity: 0.6;
        }
        .word-pool { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; justify-content: center; }

        .word-chip {
            background: var(--surface); border: 3px solid var(--border); padding: 10px 20px;
            border-radius: 999px; font-family: 'Nunito', sans-serif; font-size: 18px;
            font-weight: 800; cursor: pointer; box-shadow: var(--shadow-solid-sm); transition: all 0.1s;
        }
        .word-chip:active { transform: translateY(4px); box-shadow: 0 0px 0px var(--border); }
        .word-chip.in-builder { background: var(--purple); color: white; }

        /* --- БАСҚАРУ БАТЫРМАЛАРЫ (Навигация) --- */
        .nav-controls {
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: auto; padding-top: 20px; gap: 10px; width: 100%;
        }

        .btn {
            font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600;
            padding: 12px 20px; border-radius: var(--radius-md); cursor: pointer;
            border: 3px solid var(--border); box-shadow: var(--shadow-solid-md);
            transition: all 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            flex: 1;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0px 0px var(--border); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: translateY(0); box-shadow: var(--shadow-solid-md); }
        
        .btn-primary { background: var(--green); color: white; }
        .btn-secondary { background: var(--surface); color: var(--text-dark); }
        .btn-check { background: var(--blue); color: white; }

        /* --- ХАБАРЛАМА (Feedback) --- */
        .feedback-msg {
            padding: 16px; border-radius: var(--radius-md); font-weight: 800; font-size: 16px;
            text-align: center; margin-bottom: 20px; border: 3px solid; display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .feedback-msg.success { background: var(--green-light); color: var(--green); border-color: var(--green); display: block; }
        .feedback-msg.error { background: var(--red-light); color: var(--red); border-color: var(--red); display: block; }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- 5. АЯҚТАЛУ ЭКРАНЫ --- */
        .finish-screen {
            text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px 0;
            animation: popIn 0.5s ease;
        }
        .finish-icon {
            width: 100px; height: 100px; background: var(--yellow); border-radius: 50%;
            border: 4px solid var(--border); display: flex; align-items: center; justify-content: center;
            margin-bottom: 24px; box-shadow: var(--shadow-solid-md);
        }
        .finish-icon svg { width: 50px; height: 50px; stroke: var(--text-dark); }
        .finish-title { font-size: 28px; color: var(--green); margin-bottom: 12px; }
        .finish-text { font-size: 18px; font-weight: 700; color: var(--text-muted); margin-bottom: 30px; max-width: 400px; }

        @media (max-width: 600px) {
            .mnemo-grid, .order-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .header h1 { font-size: 26px; }
            .main-panel { padding: 16px; }
            .step-text { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Ертегілер Әлемі</h1>
            <p>Кезең-кезеңімен тапсырманы орында</p>
        </header>

        <div class="tale-selector" id="taleSelector"></div>

        <div class="progress-container" id="progressBar"></div>

        <main class="main-panel" id="mainPanel"></main>
    </div>

    <script>
        const stories = [
            {
                id: 'qasqyr',
                title: 'Қасқыр мен жеті лақ',
                steps: [
                    { title: 'Отбасы', text: 'Бұрын орманда ешкі мен оның жеті лағы тұрды.', img: 'images/qasqyr_1.jfif' },
                    { title: 'Анасы кетеді', text: 'Бір күні ана ешкі орманға азық іздеп кетеді.', img: 'images/qasqyr_2.jfif' },
                    { title: 'Қасқыр келеді', text: 'Сол кезде сұр қасқыр үйге жақындап келеді.', img: 'images/qasqyr_3.jfif' },
                    { title: 'Лақтар тығылады', text: 'Лақтар қорқып, үй ішінде тығылып қалады.', img: 'images/qasqyr_4.jfif' },
                    { title: 'Анасы оралады', text: 'Анасы келіп, лақтарын тауып алады.', img: 'images/qasqyr_5.jfif' },
                    { title: 'Бақытты аяқталу', text: 'Олар қайтадан бірге бақытты өмір сүреді.', img: 'images/qasqyr_6.jfif' }
                ],
                quiz: [
                    { q: 'Ертегінің басты кейіпкерлері кімдер?', opts: ['Ешкі, лақтар, қасқыр', 'Аю мен түлкі', 'Мысық пен тышқан'], correct: 0 },
                    { q: 'Лақтар қайда тығылды?', opts: ['Ағаш басына', 'Төсек астына', 'Орманға'], correct: 1 }
                ],
                sentence: {
                    scrambled: ['орманға', 'Бір күні', 'кетеді', 'ешкі'],
                    correct: ['Бір күні', 'ешкі', 'орманға', 'кетеді']
                }
            },
            {
                id: 'bauyrsaq',
                title: 'Бауырсақ',
                steps: [
                    { title: 'Бауырсақ пісуі', text: 'Кемпір қамыр илеп, дөңгелек бауырсақ пісіреді.', img: 'images/kolobok1.jfif' },
                    { title: 'Қашуы', text: 'Бауырсақ терезеден секіріп, орманға қашып кетеді.', img: 'images/kolobok2.jfif' },
                    { title: 'Қоян', text: 'Жолда ол қоянды кездестіріп, ән айтып қашады.', img: 'images/kolobok3.jfif' },
                    { title: 'Қасқыр мен Аю', text: 'Қасқыр мен аюдан да қулықпен құтылады.', img: 'images/kolobok4.jfif' },
                    { title: 'Түлкі', text: 'Ку түлкі оны мақтап, мұрнына қондырады.', img: 'images/kolobok5.jfif' },
                    { title: 'Аяқталуы', text: 'Абайламаған бауырсақты түлкі жеп қояды.', img: 'images/kolobok6.jfif' }
                ],
                quiz: [
                    { q: 'Бауырсақты кім пісірді?', opts: ['Әже', 'Анасы', 'Қыз'], correct: 0 },
                    { q: 'Бауырсақты кім жеп қойды?', opts: ['Қоян', 'Аю', 'Түлкі'], correct: 2 }
                ],
                sentence: {
                    scrambled: ['домалап', 'Бауырсақ', 'кетті', 'орманға'],
                    correct: ['Бауырсақ', 'орманға', 'домалап', 'кетті']
                }
            },
            {
                id: 'shalqan',
                title: 'Шалқан',
                steps: [
                    // СІЗДІҢ rb1 - rb6 СУРЕТТЕРІҢІЗ ОСЫНДА ҚОСЫЛДЫ
                    { title: 'Отырғызу', text: 'Атасы бақшаға шалқан отырғызады.', img: 'images/rb1.jfif' },
                    { title: 'Тарту', text: 'Шалқан үлкен болады, атасы тартады бірақ шығара алмайды.', img: 'images/rb2.jfif' },
                    { title: 'Әже көмектеседі', text: 'Атасы әжесін шақырады. Олар екеуі тартады.', img: 'images/rb3.jfif' },
                    { title: 'Немересі', text: 'Олар немересін шақырады, бірақ әлі де шықпайды.', img: 'images/rb4.jfif' },
                    { title: 'Жануарлар', text: 'Ит пен мысық та көмекке келеді.', img: 'images/rb5.jfif' },
                    { title: 'Шалқан шықты', text: 'Кішкентай тышқанның көмегімен шалқанды суырып алады.', img: 'images/rb6.jfif' }
                ],
                quiz: [
                    { q: 'Шалқанды ең соңында кім тартты?', opts: ['Ит', 'Мысық', 'Тышқан'], correct: 2 }
                ],
                sentence: {
                    scrambled: ['суырып', 'Барлығы', 'алды', 'шалқанды'],
                    correct: ['Барлығы', 'шалқанды', 'суырып', 'алды']
                }
            }
        ];

        let currentStory = stories[0];
        let currentStep = 1;
        let activeMnemonicIndex = 0;
        
        // Ойын күйлері (State)
        let poolState = []; 
        let slotState = [];
        let currentQuizIndex = 0;
        let availableWords = [];
        let builderWords = [];
        let stepCompleted = false;

        const icons = {
            image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
            next: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`,
            prev: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>`,
            trophy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>`,
            restart: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>`
        };

        window.onload = () => {
            renderTaleSelector();
            resetAllStates();
            renderApp();
        };

        function renderTaleSelector() {
            const container = document.getElementById('taleSelector');
            container.innerHTML = stories.map(s => `
                <button class="tale-btn ${currentStory.id === s.id ? 'active' : ''}" onclick="selectStory('${s.id}')">
                    ${s.title}
                </button>
            `).join('');
        }

        function selectStory(id) {
            currentStory = stories.find(s => s.id === id);
            resetAllStates();
            renderTaleSelector();
            renderApp();
        }

        function resetAllStates() {
            currentStep = 1;
            stepCompleted = false;
            activeMnemonicIndex = 0;
            
            poolState = currentStory.steps.map(s => s.title).sort(() => Math.random() - 0.5);
            slotState = Array(currentStory.steps.length).fill(null);
            
            currentQuizIndex = 0;
            availableWords = [...currentStory.sentence.scrambled].sort(() => Math.random() - 0.5);
            builderWords = [];
        }

        function goToNextStep() {
            if (currentStep < 5) {
                currentStep++;
                stepCompleted = false;
                renderApp();
            }
        }

        function goToPrevStep() {
            if (currentStep > 1) {
                currentStep--;
                stepCompleted = false;
                renderApp();
            }
        }

        function renderApp() {
            renderProgressBar();
            const panel = document.getElementById('mainPanel');
            
            if (currentStep === 1) renderStep1(panel);
            if (currentStep === 2) renderStep2(panel);
            if (currentStep === 3) renderStep3(panel);
            if (currentStep === 4) renderStep4(panel);
            if (currentStep === 5) renderStep5(panel);
        }

        function renderProgressBar() {
            const bar = document.getElementById('progressBar');
            const steps = [
                { num: 1, text: 'Мнемотаблица' },
                { num: 2, text: 'Ретімен құра' },
                { num: 3, text: 'Сұрақ-жауап' },
                { num: 4, text: 'Сөйлем құра' }
            ];

            let html = '';
            steps.forEach((s, i) => {
                let statusClass = 'pending';
                if (currentStep > s.num) statusClass = 'done';
                if (currentStep === s.num) statusClass = 'active';

                html += `
                    <div class="progress-step ${statusClass}">
                        <div class="step-circle">${statusClass === 'done' ? icons.check : s.num}</div>
                        <div class="step-text">${s.text}</div>
                    </div>
                `;

                if (i < steps.length - 1) {
                    html += `<div class="progress-line ${currentStep > s.num ? 'filled' : ''}"></div>`;
                }
            });
            bar.innerHTML = html;
        }

        // 1-ҚАДАМ
        function renderStep1(panel) {
            const step = currentStory.steps[activeMnemonicIndex];
            panel.innerHTML = `
                <h2 class="step-title">1. Мнемотаблицамен танысу</h2>
                <p style="text-align:center; margin-bottom:15px; font-weight:700; color:var(--text-muted);">Барлық суреттерді басып шығыңыз</p>
                
                <div class="mnemo-grid">
                    ${currentStory.steps.map((s, i) => `
                        <div class="mnemo-frame ${i === activeMnemonicIndex ? 'active' : ''}" onclick="selectMnemonic(${i})">
                            <span class="mnemo-number">${i + 1}</span>
                            ${s.img ? 
                                `<img src="${s.img}" alt="${s.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''
                            }
                            <div class="mnemo-placeholder" style="${s.img ? 'display:none;' : 'display:flex;'}">
                                ${icons.image}
                                <span>Сурет орны</span>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="story-text-box">
                    <h2 class="story-step-title">${step.title}</h2>
                    <p class="story-step-text">${step.text}</p>
                </div>

                <div class="nav-controls">
                    <button class="btn btn-secondary" onclick="goToPrevStep()" disabled>${icons.prev} Артқа</button>
                    <button class="btn btn-primary" onclick="goToNextStep()">Келесі ${icons.next}</button>
                </div>
            `;
        }

        function selectMnemonic(index) { activeMnemonicIndex = index; renderStep1(document.getElementById('mainPanel')); }

        // 2-ҚАДАМ
        function getImgSrc(title) {
            const step = currentStory.steps.find(s => s.title === title);
            return step && step.img ? step.img : '';
        }

        function renderStep2(panel) {
            panel.innerHTML = `
                <h2 class="step-title">2. Суреттерді ретімен құра</h2>
                <p style="text-align:center; margin-bottom:15px; font-weight:700; color:var(--text-muted);">Төмендегі суреттерді сүйреп, дұрыс торкөзге орналастыр</p>
                
                <div class="order-grid">
                    ${slotState.map((cardTitle, i) => `
                        <div class="order-slot" data-index="${i}" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${i})">
                            ${cardTitle ? `
                                <div class="drag-card" draggable="true" data-id="${cardTitle}" ondragstart="handleDragStart(event, '${cardTitle}', 'slot', ${i})" ondragend="handleDragEnd(event)">
                                    ${getImgSrc(cardTitle) ? 
                                        `<img src="${getImgSrc(cardTitle)}" onerror="this.style.display='none';">` : 
                                        `<div class="drag-card-text">${cardTitle}</div>`
                                    }
                                </div>
                            ` : `<span class="mnemo-number" style="border-color:var(--purple); color:var(--purple)">${i + 1}</span>`}
                        </div>
                    `).join('')}
                </div>

                <div class="drag-pool" id="dragPool" ondragover="event.preventDefault()" ondrop="handleDropToPool(event)">
                    ${poolState.length === 0 ? '<span style="width:100%; text-align:center; color:var(--purple); font-weight:700; opacity:0.5;">Барлық суреттер орналастырылды</span>' : ''}
                    ${poolState.map((cardTitle, i) => `
                        <div class="drag-card" draggable="true" data-id="${cardTitle}" ondragstart="handleDragStart(event, '${cardTitle}', 'pool', ${i})" ondragend="handleDragEnd(event)">
                            ${getImgSrc(cardTitle) ? 
                                `<img src="${getImgSrc(cardTitle)}" onerror="this.style.display='none';">` : 
                                `<div class="drag-card-text">${cardTitle}</div>`
                            }
                        </div>
                    `).join('')}
                </div>

                <div id="feedback-2" class="feedback-msg"></div>

                <div class="nav-controls">
                    <button class="btn btn-secondary" onclick="goToPrevStep()">${icons.prev} Артқа</button>
                    ${!stepCompleted ? 
                        `<button class="btn btn-check" onclick="checkOrder()">Тексеру ${icons.check}</button>` :
                        `<button class="btn btn-primary" onclick="goToNextStep()">Келесі ${icons.next}</button>`
                    }
                </div>
            `;
        }

        let draggedItem = null;

        function handleDragStart(e, cardTitle, source, index) { 
            draggedItem = { cardTitle, source, index };
            e.target.style.opacity = '0.4'; 
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', cardTitle);
        }

        function handleDragEnd(e) { 
            e.target.style.opacity = '1'; 
            document.querySelectorAll('.order-slot, .drag-pool').forEach(s => s.classList.remove('drag-over')); 
        }

        function handleDragOver(e) { 
            e.preventDefault(); 
            e.currentTarget.classList.add('drag-over'); 
        }

        function handleDrop(e, targetSlotIndex) {
            e.preventDefault(); 
            e.currentTarget.classList.remove('drag-over');
            if (!draggedItem) return;

            if (draggedItem.source === 'pool') {
                poolState.splice(draggedItem.index, 1);
                if (slotState[targetSlotIndex]) {
                    poolState.push(slotState[targetSlotIndex]);
                }
                slotState[targetSlotIndex] = draggedItem.cardTitle;
            } else if (draggedItem.source === 'slot') {
                const sourceIdx = draggedItem.index;
                const targetCard = slotState[targetSlotIndex];
                slotState[targetSlotIndex] = slotState[sourceIdx];
                slotState[sourceIdx] = targetCard; 
            }

            draggedItem = null;
            stepCompleted = false;
            hideFeedback('feedback-2');
            renderStep2(document.getElementById('mainPanel'));
        }

        function handleDropToPool(e) {
            e.preventDefault();
            if (!draggedItem) return;
            if (draggedItem.source === 'slot') {
                poolState.push(slotState[draggedItem.index]);
                slotState[draggedItem.index] = null;
            }
            draggedItem = null;
            stepCompleted = false;
            hideFeedback('feedback-2');
            renderStep2(document.getElementById('mainPanel'));
        }

        function checkOrder() {
            if (slotState.includes(null)) {
                showFeedback('feedback-2', 'Барлық торкөздерді толтырыңыз!', 'error');
                return;
            }

            let isCorrect = true;
            for (let i = 0; i < currentStory.steps.length; i++) {
                if (slotState[i] !== currentStory.steps[i].title) {
                    isCorrect = false;
                    break;
                }
            }

            if(isCorrect) {
                showFeedback('feedback-2', 'Керемет! Барлық суреттер дұрыс ретімен қойылды!', 'success');
                stepCompleted = true;
                renderStep2(document.getElementById('mainPanel'));
            } else {
                showFeedback('feedback-2', 'Кейбір суреттердің орны қате. Қайталап көріңіз.', 'error');
            }
        }

        // 3-ҚАДАМ
        function renderStep3(panel) {
            if (currentQuizIndex >= currentStory.quiz.length) {
                panel.innerHTML = `
                    <h2 class="step-title">3. Сұрақ-жауап</h2>
                    <div class="finish-screen" style="height:auto; padding: 40px 0;">
                        <div class="finish-icon" style="width:80px; height:80px; background:var(--green); border-color:var(--green)">
                            ${icons.check}
                        </div>
                        <h2 class="finish-title" style="font-size:24px;">Барлық сұрақтарға жауап бердіңіз!</h2>
                    </div>
                    <div class="nav-controls">
                        <button class="btn btn-secondary" onclick="goToPrevStep()">${icons.prev} Артқа</button>
                        <button class="btn btn-primary" onclick="goToNextStep()">Келесі ${icons.next}</button>
                    </div>
                `;
                return;
            }

            const q = currentStory.quiz[currentQuizIndex];
            panel.innerHTML = `
                <h2 class="step-title">3. Сұрақ-жауап</h2>
                <div class="quiz-progress">Сұрақ ${currentQuizIndex + 1} / ${currentStory.quiz.length}</div>
                <h2 class="quiz-question">${q.q}</h2>
                
                <div id="feedback-3" class="feedback-msg"></div>
                
                <div id="quizOptions">
                    ${q.opts.map((opt, i) => `
                        <button class="quiz-option" onclick="answerQuiz(${i})">
                            <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                            ${opt}
                        </button>
                    `).join('')}
                </div>

                <div class="nav-controls">
                    <button class="btn btn-secondary" onclick="goToPrevStep()">${icons.prev} Артқа</button>
                    <button class="btn btn-primary" disabled>Келесі ${icons.next}</button>
                </div>
            `;
        }

        function answerQuiz(idx) {
            const q = currentStory.quiz[currentQuizIndex];
            const btns = document.querySelectorAll('.quiz-option');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (idx === q.correct) {
                btns[idx].classList.add('correct');
                showFeedback('feedback-3', 'Дұрыс жауап!', 'success');
                
                setTimeout(() => {
                    currentQuizIndex++;
                    renderStep3(document.getElementById('mainPanel'));
                }, 1200);
            } else {
                btns[idx].classList.add('wrong');
                btns[q.correct].classList.add('correct');
                showFeedback('feedback-3', 'Қате жауап. Қайталап көріңіз.', 'error');
                
                setTimeout(() => {
                    btns.forEach(b => { b.classList.remove('wrong', 'correct'); b.style.pointerEvents = 'auto'; });
                    hideFeedback('feedback-3');
                }, 1500);
            }
        }

        // 4-ҚАДАМ
        function renderStep4(panel) {
            panel.innerHTML = `
                <h2 class="step-title">4. Сөйлемді құра</h2>
                <p style="text-align:center; margin-bottom:15px; font-weight:700; color:var(--text-muted);">Сөздерді ретімен басыңыз</p>

                <div class="sentence-builder" id="sentenceBuilder">
                    ${builderWords.map((w, i) => `
                        <button class="word-chip in-builder" onclick="removeWord(${i})">${w}</button>
                    `).join('')}
                </div>

                <div class="word-pool">
                    ${availableWords.map((w, i) => `
                        <button class="word-chip" onclick="addWord('${w}', ${i})">${w}</button>
                    `).join('')}
                </div>

                <div id="feedback-4" class="feedback-msg"></div>

                <div class="nav-controls">
                    <button class="btn btn-secondary" onclick="goToPrevStep()">${icons.prev} Артқа</button>
                    ${!stepCompleted ? 
                        `<button class="btn btn-check" onclick="checkSentence()">Тексеру ${icons.check}</button>` :
                        `<button class="btn btn-primary" onclick="goToNextStep()">Аяқтау ${icons.next}</button>`
                    }
                </div>
            `;
        }

        function addWord(word, index) {
            availableWords.splice(index, 1);
            builderWords.push(word);
            hideFeedback('feedback-4');
            stepCompleted = false;
            renderStep4(document.getElementById('mainPanel'));
        }

        function removeWord(index) {
            const word = builderWords.splice(index, 1)[0];
            availableWords.push(word);
            hideFeedback('feedback-4');
            stepCompleted = false;
            renderStep4(document.getElementById('mainPanel'));
        }

        function checkSentence() {
            const correct = currentStory.sentence.correct.join(' ');
            const user = builderWords.join(' ');
            
            if (correct === user) {
                showFeedback('feedback-4', 'Керемет! Сөйлемді дұрыс құрастырдыңыз!', 'success');
                stepCompleted = true;
                renderStep4(document.getElementById('mainPanel'));
            } else {
                showFeedback('feedback-4', 'Қате. Сөздердің орнын ауыстырып көріңіз.', 'error');
            }
        }

        // 5-ҚАДАМ
        function renderStep5(panel) {
            panel.innerHTML = `
                <div class="finish-screen">
                    <div class="finish-icon">
                        ${icons.trophy}
                    </div>
                    <h2 class="finish-title">Құттықтаймыз!</h2>
                    <p class="finish-text">Сіз барлық тапсырмаларды сәтті орындадыңыз және ертегіні жаттап алдыңыз!</p>
                    
                    <button class="btn btn-secondary" onclick="restartLesson()" style="margin-top:20px; max-width:200px;">
                        ${icons.restart} Қайтадан бастау
                    </button>
                </div>
            `;
        }

        function restartLesson() {
            resetAllStates();
            renderApp();
        }

        function showFeedback(elementId, text, type) {
            const el = document.getElementById(elementId);
            if (el) {
                el.textContent = text;
                el.className = `feedback-msg ${type}`;
            }
        }

        function hideFeedback(elementId) {
            const el = document.getElementById(elementId);
            if (el) el.className = 'feedback-msg';
        }
    </script>
</body>
</html>
